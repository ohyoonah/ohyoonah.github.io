<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="320" fill="#f8fafc" rx="16"/>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Claude Code 하네스 에이전트 파이프라인</text>

  <!-- Shared Memory Bar -->
  <rect x="30" y="230" width="860" height="48" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="249" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="500">SHARED MEMORY</text>
  <text x="460" y="267" text-anchor="middle" font-size="12" fill="#64748b">.claude/memory/current-spec.md</text>

  <!-- Vertical connectors to memory -->
  <line x1="100" y1="190" x2="100" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="190" x2="280" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="190" x2="460" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="640" y1="190" x2="640" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="820" y1="190" x2="820" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Arrows between agents -->
  <line x1="172" y1="130" x2="208" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="352" y1="130" x2="388" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="532" y1="130" x2="568" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="712" y1="130" x2="748" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Agent: 기획 -->
  <rect x="30" y="80" width="142" height="110" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="80" width="142" height="36" rx="12" fill="#6366f1"/>
  <rect x="30" y="104" width="142" height="12" fill="#6366f1"/>
  <text x="101" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">/plan</text>
  <text x="101" y="136" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">기획 에이전트</text>
  <text x="101" y="155" text-anchor="middle" font-size="11" fill="#94a3b8">요구사항 분석</text>
  <text x="101" y="172" text-anchor="middle" font-size="11" fill="#94a3b8">스펙 문서 작성</text>

  <!-- Agent: 개발 -->
  <rect x="210" y="80" width="142" height="110" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="210" y="80" width="142" height="36" rx="12" fill="#3b82f6"/>
  <rect x="210" y="104" width="142" height="12" fill="#3b82f6"/>
  <text x="281" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">/dev</text>
  <text x="281" y="136" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">개발 에이전트</text>
  <text x="281" y="155" text-anchor="middle" font-size="11" fill="#94a3b8">스펙 기반 구현</text>
  <text x="281" y="172" text-anchor="middle" font-size="11" fill="#94a3b8">코드 작성</text>

  <!-- Agent: QA 화이트박스 -->
  <rect x="390" y="80" width="142" height="110" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="390" y="80" width="142" height="36" rx="12" fill="#8b5cf6"/>
  <rect x="390" y="104" width="142" height="12" fill="#8b5cf6"/>
  <text x="461" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">/qa-white</text>
  <text x="461" y="136" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">화이트박스 QA</text>
  <text x="461" y="155" text-anchor="middle" font-size="11" fill="#94a3b8">코드 리뷰 · 타입</text>
  <text x="461" y="172" text-anchor="middle" font-size="11" fill="#94a3b8">린트 · 유닛 테스트</text>

  <!-- Agent: QA 블랙박스 -->
  <rect x="570" y="80" width="142" height="110" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <rect x="570" y="80" width="142" height="36" rx="12" fill="#475569"/>
  <rect x="570" y="104" width="142" height="12" fill="#475569"/>
  <text x="641" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">/qa-black</text>
  <text x="641" y="136" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">블랙박스 QA</text>
  <text x="641" y="155" text-anchor="middle" font-size="11" fill="#94a3b8">기능 동작 확인</text>
  <text x="641" y="172" text-anchor="middle" font-size="11" fill="#94a3b8">UX · 엣지케이스</text>

  <!-- Agent: 배포 -->
  <rect x="750" y="80" width="142" height="110" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="750" y="80" width="142" height="36" rx="12" fill="#10b981"/>
  <rect x="750" y="104" width="142" height="12" fill="#10b981"/>
  <text x="821" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">/deploy</text>
  <text x="821" y="136" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">배포 에이전트</text>
  <text x="821" y="155" text-anchor="middle" font-size="11" fill="#94a3b8">빌드 &amp; 배포</text>
  <text x="821" y="172" text-anchor="middle" font-size="11" fill="#94a3b8">헬스체크</text>
</svg>
