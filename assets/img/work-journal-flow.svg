  </g>
  <path d="M670 288 v22 h22" fill="none" stroke="#c7d2e0" stroke-width="3"/>
  <rect x="624" y="330" width="48" height="7" rx="3.5" fill="#c3cfdd"/>
  <rect x="624" y="346" width="56" height="7" rx="3.5" fill="#c3cfdd"/>
  <rect x="624" y="362" width="36" height="7" rx="3.5" fill="#93a7bf"/>
  <text x="654" y="412" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">재료 파일</text>
  <text x="654" y="440" font-size="18" fill="#64748b" text-anchor="middle">건수 · 도달 단계까지</text>
  <text x="654" y="462" font-size="18" fill="#64748b" text-anchor="middle">파이썬이 계산해 적어둔다</text>

  <!-- ⑤ 모델 -->
  <g filter="url(#ic)">
    <rect x="800" y="286" width="104" height="88" rx="16" fill="#dbeafe" stroke="#7fb0ee" stroke-width="3"/>
  </g>
  <circle cx="828" cy="318" r="6" fill="#2563eb"/>
  <circle cx="852" cy="318" r="6" fill="#2563eb"/>
  <path d="M824 344 q28 18 56 0" stroke="#2563eb" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="882" y="312" font-size="20" fill="#2563eb">✦</text>
  <text x="852" y="412" font-size="23" font-weight="700" fill="#1e40af" text-anchor="middle">claude -p</text>
  <text x="852" y="440" font-size="18" fill="#3f6cb0" text-anchor="middle">브리핑 · 오늘 진행할 작업</text>
  <text x="852" y="462" font-size="18" fill="#3f6cb0" text-anchor="middle">어긋난 자리를 문장으로</text>

  <!-- ⑥-1 Notion -->
  <g filter="url(#ic)">
    <rect x="1024" y="150" width="88" height="76" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="3"/>
  </g>
  <text x="1050" y="203" font-size="34" font-weight="800" fill="#475569">N</text>
  <text x="1068" y="256" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">Notion 페이지</text>
  <text x="1068" y="282" font-size="18" fill="#64748b" text-anchor="middle">notion-create-pages (MCP)</text>
  <text x="1068" y="304" font-size="18" fill="#64748b" text-anchor="middle">일간 · 주간 · 월간 DB</text>

  <!-- ⑥-2 슬랙 -->
  <g filter="url(#ic)">
    <path d="M1024 440 h88 a10 10 0 0 1 10 10 v46 a10 10 0 0 1 -10 10 h-52 l-22 20 v-20 h-14 a10 10 0 0 1 -10 -10 v-46 a10 10 0 0 1 10 -10 z"
