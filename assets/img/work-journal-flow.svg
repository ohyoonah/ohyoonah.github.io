<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" font-family="system-ui, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
    <filter id="ic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a1c"/>
    </filter>
  </defs>

  <rect width="1240" height="660" fill="#eef1f5" rx="18"/>
  <text x="620" y="72" font-size="34" font-weight="800" fill="#1e293b" text-anchor="middle">업무일지 자동화 동작 구조</text>

  <!-- ① 시계 -->
  <g filter="url(#ic)">
    <circle cx="112" cy="330" r="44" fill="#ffffff" stroke="#c7d2e0" stroke-width="3"/>
  </g>
  <line x1="112" y1="330" x2="112" y2="302" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="330" x2="132" y2="342" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <text x="112" y="412" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">평일 09:30</text>
  <text x="112" y="440" font-size="19" fill="#64748b" text-anchor="middle">launchd</text>

  <!-- ② 셸 스크립트 -->
  <g filter="url(#ic)">
    <rect x="238" y="292" width="88" height="76" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="3"/>
  </g>
  <text x="258" y="342" font-size="26" font-weight="700" fill="#475569">&gt;_</text>
  <text x="282" y="412" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">셸 스크립트</text>
  <text x="282" y="440" font-size="19" fill="#64748b" text-anchor="middle">work-journal.sh</text>

  <!-- ③-1 Jira -->
  <g filter="url(#ic)">
    <rect x="418" y="150" width="88" height="76" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="3"/>
  </g>
  <rect x="436" y="170" width="52" height="8" rx="4" fill="#93a7bf"/>
  <rect x="436" y="186" width="40" height="8" rx="4" fill="#c3cfdd"/>
  <rect x="436" y="202" width="46" height="8" rx="4" fill="#c3cfdd"/>
  <text x="462" y="256" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">Jira REST API</text>
  <text x="462" y="282" font-size="18" fill="#64748b" text-anchor="middle">내 미완료 티켓 · ORDER BY Rank</text>
  <text x="462" y="304" font-size="18" fill="#64748b" text-anchor="middle">멈춘 티켓 댓글</text>

  <!-- ③-2 git -->
  <g filter="url(#ic)">
    <rect x="418" y="434" width="88" height="76" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="3"/>
  </g>
  <circle cx="442" cy="458" r="7" fill="#93a7bf"/>
  <circle cx="442" cy="490" r="7" fill="#93a7bf"/>
  <circle cx="480" cy="474" r="7" fill="#93a7bf"/>
  <path d="M442 458 L442 490 M442 474 L480 474" stroke="#93a7bf" stroke-width="3" fill="none"/>
  <text x="462" y="544" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">git log</text>
  <text x="462" y="570" font-size="18" fill="#64748b" text-anchor="middle">어제 커밋 · 티켓별 도달 단계</text>
  <text x="462" y="592" font-size="18" fill="#64748b" text-anchor="middle">develop · staging · main</text>

  <!-- ④ 재료 파일 -->
  <g filter="url(#ic)">
    <path d="M612 288 h58 l22 22 v72 a10 10 0 0 1 -10 10 h-70 a10 10 0 0 1 -10 -10 v-84 a10 10 0 0 1 10 -10 z"
