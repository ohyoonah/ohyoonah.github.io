  </g>
  <circle cx="1048" cy="474" r="5" fill="#93a7bf"/>
  <circle cx="1068" cy="474" r="5" fill="#93a7bf"/>
  <circle cx="1088" cy="474" r="5" fill="#93a7bf"/>
  <text x="1068" y="558" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">슬랙 DM</text>
  <text x="1068" y="584" font-size="18" fill="#64748b" text-anchor="middle">웹후크 · 평문</text>
  <text x="1068" y="606" font-size="18" fill="#64748b" text-anchor="middle">라벨·수치는 셸이 씌운다</text>

  <!-- arrows -->
  <line x1="162" y1="330" x2="228" y2="330" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <path d="M332 316 q40 0 60 -80" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M332 344 q40 0 60 80" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <path d="M512 200 q60 0 82 100" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M512 460 q60 0 82 -100" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <line x1="708" y1="330" x2="790" y2="330" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <path d="M912 314 q60 0 82 -100" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M912 346 q60 0 82 100" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 하단 주석 -->
  <text x="620" y="640" font-size="18" fill="#8494a8" text-anchor="middle">월요일에는 주간 정리가, 달이 바뀐 뒤 첫 월요일에는 월간 정리가 같은 흐름으로 한 번 더 돈다</text>
</svg>
