  <circle cx="62" cy="301" r="2.5" fill="#37352f"/>
  <text x="76" y="305" font-size="12.5" fill="#37352f"><tspan font-weight="600" fill="#2563eb">ABC-2689</tspan> 목록 필터 추가 — 실서버 배포 완료, 티켓은 <tspan fill="#9b9a97">In Review</tspan> · A</text>
  <circle cx="62" cy="325" r="2.5" fill="#37352f"/>
  <text x="76" y="329" font-size="12.5" fill="#37352f"><tspan font-weight="600" fill="#2563eb">ABC-2750</tspan> 상세 화면 개편 — 티켓만 갱신, 커밋 없음 · A</text>

  <!-- 이어서 할 것 -->
  <text x="56" y="371" font-size="15" font-weight="700" fill="#37352f">이어서 할 것</text>
  <rect x="57" y="389" width="11" height="11" rx="2.5" fill="#ffffff" stroke="#b1b0ad"/>
  <text x="80" y="399" font-size="12.5" fill="#37352f"><tspan font-weight="600" fill="#2563eb">ABC-2750</tspan> 상세 화면 개편</text>

