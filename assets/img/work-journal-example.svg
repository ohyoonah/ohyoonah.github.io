  <text x="474" y="618" font-size="11.5" font-weight="700" fill="#37352f">3일+ 정체</text>
  <text x="676" y="618" font-size="11.5" font-weight="700" fill="#37352f">내 커밋</text>
  <text x="70" y="642" font-size="12" fill="#37352f">3</text>
  <text x="272" y="642" font-size="12" fill="#37352f">2</text>
  <text x="474" y="642" font-size="12" fill="#37352f">1</text>
  <text x="676" y="642" font-size="12" fill="#37352f">4</text>
