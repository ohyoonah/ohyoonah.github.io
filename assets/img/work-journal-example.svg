  <text x="614" y="473" font-size="11.5" font-weight="700" fill="#37352f">dev</text>
  <text x="672" y="473" font-size="11.5" font-weight="700" fill="#37352f">stg</text>
  <text x="726" y="473" font-size="11.5" font-weight="700" fill="#37352f">main</text>
  <text x="788" y="473" font-size="11.5" font-weight="700" fill="#37352f">작업자</text>

  <text x="70" y="499" font-size="12" font-weight="700" fill="#2563eb">ABC-2689</text>
  <text x="244" y="499" font-size="12" fill="#37352f">목록 필터 추가 — 저장 흐름 보완</text>
  <text x="623" y="499" font-size="11">✅</text>
  <text x="679" y="499" font-size="11">✅</text>
  <text x="739" y="499" font-size="11">✅</text>
  <text x="788" y="499" font-size="12" fill="#37352f">A</text>

  <text x="70" y="525" font-size="12" fill="#2563eb">ABC-2695</text>
  <text x="244" y="525" font-size="12" fill="#37352f">비활성 버튼 색 오류</text>
  <text x="623" y="525" font-size="11">✅</text>
  <text x="679" y="525" font-size="11">✅</text>
  <text x="788" y="525" font-size="12" fill="#37352f">B</text>

  <text x="56" y="558" font-size="11" fill="#9b9a97">main 열이 빈 행이 실서버 배포가 남은 것 · 파란 행이 내 작업</text>

  <!-- 수치 표 -->
  <text x="56" y="590" font-size="15" font-weight="700" fill="#37352f">수치</text>
  <g stroke="#e9e9e7" stroke-width="1">
