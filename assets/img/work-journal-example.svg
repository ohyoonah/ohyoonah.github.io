  <text x="56" y="441" font-size="15" font-weight="700" fill="#37352f">어제 배포 <tspan font-size="11.5" font-weight="400" fill="#9b9a97">(팀 전체)</tspan></text>

  <g stroke="#e9e9e7" stroke-width="1">
