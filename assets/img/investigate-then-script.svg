<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="system-ui, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="s1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a1a"/>
    </filter>
  </defs>

  <rect width="920" height="300" fill="#f8fafc" rx="16"/>

  <!-- 좌: 한 번 -->
  <rect x="40" y="70" width="250" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="98" font-size="12.5" font-weight="700" fill="#1d4ed8">한 번만</text>

  <g filter="url(#s1)">
    <rect x="60" y="112" width="210" height="88" rx="8" fill="#ffffff" stroke="#dbeafe"/>
  </g>
  <text x="165" y="140" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Claude에게 조사를 시킨다</text>
  <text x="165" y="164" font-size="12.5" fill="#64748b" text-anchor="middle">키가 양쪽에 다 있는지 대조하고,</text>
  <text x="165" y="182" font-size="12.5" fill="#64748b" text-anchor="middle">어긋난 것 중 실제로 쓰이는 걸 골라낸다</text>

  <!-- 중앙: 산출물 -->
  <line x1="292" y1="145" x2="358" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="325" y="134" font-size="11.5" fill="#64748b" text-anchor="middle">결과를</text>
  <text x="325" y="168" font-size="11.5" fill="#64748b" text-anchor="middle">코드로 받는다</text>

  <g filter="url(#s1)">
    <rect x="362" y="118" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="460" y="142" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">check-i18n.js</text>
  <text x="460" y="161" font-size="11.5" fill="#94a3b8" text-anchor="middle">결과가 항상 같다</text>

  <line x1="562" y1="145" x2="628" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="595" y="134" font-size="11.5" fill="#64748b" text-anchor="middle">CI에</text>
  <text x="595" y="168" font-size="11.5" fill="#64748b" text-anchor="middle">걸어둔다</text>

  <!-- 우: 매 PR -->
  <rect x="632" y="70" width="248" height="150" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="652" y="98" font-size="12.5" font-weight="700" fill="#047857">매 PR마다</text>

  <g filter="url(#s1)">
    <rect x="652" y="112" width="208" height="88" rx="8" fill="#ffffff" stroke="#d1fae5"/>
  </g>
  <text x="756" y="140" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">CI가 알아서 돌린다</text>
  <text x="756" y="164" font-size="12.5" fill="#64748b" text-anchor="middle">사람이 기억해서 부르지 않아도 되고,</text>
  <text x="756" y="182" font-size="12.5" fill="#64748b" text-anchor="middle">토큰도 들지 않는다</text>

  <!-- 하단 대비 -->
  <line x1="40" y1="244" x2="880" y2="244" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="272" font-size="12.5" fill="#64748b">판단이 필요한 건 대화로 남기고, 기계적으로 반복되는 건 코드로 내려보낸다.</text>
</svg>
